<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinSight - Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>

<body class="auth-page">
  {% include 'public_navbar.html' %}
  <main class="auth-shell">
    <header class="auth-header auth-card-status">
      <span class="secure-chip"><i></i> Secure by design</span>
    </header>

    <section class="auth-content">
      <div class="auth-panel">
        <span class="eyebrow">{{ t("Account recovery") }}</span>
        <h1 class="panel-title">{{ t("Choose a new password") }}</h1>
        <p class="panel-intro">{{ t("Choose a new password for your FinSight account.") }}</p>

        {% if error %}
          <p class="form-error" role="alert">{{ t(error) }}</p>
        {% endif %}

        <form action="{{ url_for('password_reset') }}" method="POST">
          <input type="hidden" name="_auth_csrf_token" value="{{ auth_csrf_token() }}">
          <div class="field">
            <label for="new-password">{{ t("New password") }}</label>
            <div class="field-line">
              <span class="field-icon" aria-hidden="true">*</span>
              <input id="new-password" name="new_password" type="password" minlength="8" required autocomplete="new-password" placeholder="{{ t('At least 8 characters') }}">
            </div>
          </div>
          <div class="field">
            <label for="confirm-password">{{ t("Confirm password") }}</label>
            <div class="field-line">
              <span class="field-icon" aria-hidden="true">*</span>
              <input id="confirm-password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" placeholder="{{ t('Repeat your password') }}">
            </div>
          </div>
          <button type="submit" class="submit-btn"><span>{{ t("Reset password") }}</span><span class="button-arrow" aria-hidden="true">&rarr;</span></button>
        </form>

        <p class="auth-switch"><a class="text-button" href="{{ url_for('login') }}">{{ t("Back to Login") }}</a></p>
      </div>
    </section>
  </main>

  {% include 'public_footer.html' %}
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
