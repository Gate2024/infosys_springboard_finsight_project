<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Sign In - FinSight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-shell">
    <div class="form-panel sign-in-panel">
      <div class="panel-inner">
        <span class="eyebrow">Security check</span>
        <h1 class="panel-title">Verify your sign in.</h1>
        <p class="panel-intro">Enter the current code from your authenticator app.</p>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form id="twoFactorLoginForm" action="{{ url_for('login_two_factor') }}" method="POST">
          <input type="hidden" name="_two_factor_login_csrf_token" value="{{ two_factor_login_csrf_token }}">
          <div class="field">
            <label for="totp_code">Authenticator code</label>
            <div class="field-line">
              <input id="totp_code" name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus>
            </div>
          </div>
          <button type="submit" class="submit-btn"><span>Verify and continue</span><span class="button-arrow" aria-hidden="true">→</span></button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
